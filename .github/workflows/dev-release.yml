name: Build and Pre-release

on:
  push:
    branches:
      - main
      - dev

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Ruby (for CocoaPods)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install iOS dependencies
        run: |
          cd iosApp
          pod install

      - name: Build iOS app (unsigned .ipa)
        run: |
          cd iosApp
          xcodebuild -workspace iosApp.xcworkspace \
            -scheme iosApp \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/iosApp.xcarchive archive
          xcodebuild -exportArchive \
            -archivePath $PWD/build/iosApp.xcarchive \
            -exportPath $PWD/build/exported \
            -exportOptionsPlist ExportOptions.plist || true

      - name: Find IPA
        id: find-ipa
        run: |
          IPA_PATH=$(find iosApp/build/exported -name "*.ipa" | head -n 1)
          echo "ipa_path=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Upload iOS IPA
        if: steps.find-ipa.outputs.ipa_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ steps.find-ipa.outputs.ipa_path }}

  release:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: android-apk
          path: artifacts/android

      - name: Download iOS IPA
        uses: actions/download-artifact@v5
        with:
          name: ios-ipa
          path: artifacts/ios

      - name: Generate AI Commit Summary
        id: ai-summary
        run: |
          # Fetch latest commit info
          COMMIT_MSG=$(git log -1 --pretty=%B)
          AUTHOR=$(git log -1 --pretty=%an)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --pretty=%cd --date=iso)
          # Generate a styled AI message (Markdown)
          echo "## 🚀 Auto-generated Build Summary" > summary.md
          echo "" >> summary.md
          echo "> **Commit:** \`$SHORT_SHA\` by **$AUTHOR**" >> summary.md
          echo "> **Date:** $DATE" >> summary.md
          echo "" >> summary.md
          echo "### 📝 Latest Commit Message" >> summary.md
          echo "\`\`\`" >> summary.md
          echo "$COMMIT_MSG" >> summary.md
          echo "\`\`\`" >> summary.md
          echo "" >> summary.md
          echo "----" >> summary.md
          echo "<sub>🤖 This pre-release and summary were generated automatically by GitHub Actions AI.</sub>" >> summary.md
          echo "summary_path=summary.md" >> $GITHUB_OUTPUT

      - name: Read summary for release notes
        id: get-summary
        run: |
          SUMMARY=$(cat summary.md)
          SUMMARY="${SUMMARY//'%'/'%25'}"
          SUMMARY="${SUMMARY//$'\n'/'%0A'}"
          SUMMARY="${SUMMARY//$'\r'/'%0D'}"
          echo "summary=$SUMMARY" >> $GITHUB_OUTPUT

      - name: Create/Update Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          body: ${{ steps.get-summary.outputs.summary }}
          files: |
            artifacts/android/*.apk
            artifacts/ios/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
