name: Build and Pre-release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :composeApp:assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: composeApp/build/outputs/apk/debug/*.apk

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: android-apk
          path: artifacts/android

      - name: Generate Commit Summary
        id: summary
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          AUTHOR=$(git log -1 --pretty=%an)
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --pretty=%cd --date=iso)
          printf "## 🚀 Auto-generated Build Summary\n\n" > summary.md
          printf "> **Commit:** \`$SHORT_SHA\` by **$AUTHOR**\n" >> summary.md
          printf "> **Date:** $DATE\n\n" >> summary.md
          printf "### 📝 Latest Commit Message\n" >> summary.md
          # Escape Markdown code-fence backticks to avoid shell command substitution
          printf "\`\`\`\n%s\n\`\`\`\n\n" "$COMMIT_MSG" >> summary.md
          printf "----\n" >> summary.md
          printf "<sub>🤖 This pre-release and summary were generated automatically by GitHub Actions AI.</sub>\n" >> summary.md
          echo "summary_path=summary.md" >> $GITHUB_OUTPUT

      - name: Create/Update Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: Latest Dev Build
          prerelease: true
          body_path: ${{ steps.summary.outputs.summary_path }}
          files: |
            artifacts/android/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
